# Claim manifest — the machine-readable index of every sourced claim the site
# publishes. It is the backbone of the research refresh:
#
#   * The refresh's `verify` matrix shards over this file, so re-verification is
#     a bounded, parallelizable worklist rather than one agent re-reading every
#     page.
#   * `volatility` sets how often each claim is re-checked: `high` every cycle;
#     `medium`/`low` only once they age past a threshold (see the inventory job
#     in .github/workflows/research-refresh.yml). This keeps each run's work
#     bounded instead of scaling with the whole site.
#   * `last_verified` is the coverage ledger — the weekly freshness check and a
#     glance at this file both tell you what is overdue.
#
# This manifest is NOT the evidence trail — the dated notes in this directory
# are. It records *what* is claimed and *when it was last checked*; the notes
# record *why* it was believed. Keep the two in step: when the apply stage adds
# a changelog entry or corrects a claim, it updates the matching row here.
#
# Fields per claim:
#   id            stable kebab-case slug; the shard key — never reuse or renumber
#   pages         every page the claim appears on (edit all when it changes)
#   claim         one neutral sentence stating the claim
#   status        badge state: shipped | announced | reported | speculative
#   sources       the URL(s) from the claim's citation line
#   last_verified YYYY-MM-DD the claim was last confirmed against its source
#   volatility    high | medium | low — how fast the fact tends to move
meta:
  schema: 1
  updated: 2026-09-04
