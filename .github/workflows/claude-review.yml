# Automatic agentic code review on every pull request that touches the site
# or docs. Uses the site-reviewer conventions from .claude/agents/.
#
# NOTE: do not add --allowedTools here. It REPLACES the action's default
# toolset rather than extending it, and the defaults are what let the agent
# read the diff and post its review. Two attempts to hand-write that list both
# failed silently: the first (html-validate only) ran 3 minutes with 7
# permission denials; the second, which guessed at the comment tool names, ran
# 10 minutes over 51 turns, cost $3.60, hit 15 denials — and still posted
# nothing. The reviewer does not need its own html-validate: the ci workflow
# already validates every PR.
name: Claude PR Review

on:
  pull_request:
    # Deliberately NOT `synchronize`. A review costs a full agent run — it
    # re-reads the diff, .claude/agents/site-reviewer.md and docs/DESIGN.md
    # every time — and `synchronize` fires on every push to an open PR, so a
    # branch pushed four times was reviewed four times. That is why 19 review
    # runs covered roughly five merged PRs. Reviewing when a PR opens (or
    # leaves draft) catches the same problems at a fraction of the spend; to
    # re-review after pushing fixes, comment `@claude` on the PR, which the
    # claude.yml workflow picks up.
    types: [opened, ready_for_review]
    paths:
      - "*.html"
      - "assets/**"
      - "docs/**"

jobs:
  review:
    # Skip drafts and the agent's own trivial loops on forks without secrets
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # An agent job that hangs would otherwise run to GitHub's 6-hour default,
    # burning API tokens silently. A review of a large PR takes minutes, so
    # this is generous; if it trips, that is a signal worth investigating.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      # secrets context is unavailable in job-level `if`, so gate steps via env
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Notice when ANTHROPIC_API_KEY is not configured
        if: env.HAS_ANTHROPIC_KEY != 'true'
        run: |
          echo "::notice::Skipping agentic PR review: ANTHROPIC_API_KEY secret is not set." \
            "Add it under Settings → Secrets and variables → Actions (see docs/WORKFLOW.md)."

      - name: Checkout repository
        if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Claude review
        id: agent
        if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The action refuses non-human actors by default, which is the right
          # default — it stops a bot-authored event from driving an agent run.
          # But the research refresh opens its PR as claude[bot], and
          # those PRs are exactly the ones most worth reviewing: they change
          # sourced claims without a human having written a line. Allow that one
          # bot by name rather than "*", so any other bot still cannot trigger a
          # review. No loop risk: reviews post comments, and comments do not
          # raise pull_request events.
          allowed_bots: "claude"
          # Sonnet, not the default Opus. Reviewing is checking a diff against
          # two written checklists (site-reviewer.md and DESIGN.md) — the same
          # mechanical shape as the refresh's verify shards, which already run
          # on Sonnet. This is the most frequently triggered agent in the repo,
          # so the tier matters more here than anywhere else. Only --model:
          # adding --allowedTools here would REPLACE the action's defaults (see
          # the note at the top of this file), but --model does not touch them.
          claude_args: |
            --model sonnet
          prompt: |
            Review this pull request against two documents, reading both
            before you start: .claude/agents/site-reviewer.md (the review
            checklist) and docs/DESIGN.md (the binding design guide).

            Check, in priority order:
            1. Sourcing — every new or changed factual claim carries a source
               link and a "last verified" date.
            2. Badge discipline (DESIGN.md §5) — the four states are used
               correctly, badges mark exceptions rather than every claim, and
               a badge's scope is unambiguous. Flag badge inflation: a page
               where one state accounts for the large majority of badges is a
               defect.
            3. Neutrality — comparison content describes rather than
               advocates; neither protocol gets favorable visual or verbal
               treatment.
            4. Shared markup — nav and footer identical across all pages, and
               the footer still carries the AI transparency notice and the
               copyright line.
            5. Design guide compliance — no banned "AI slop" patterns (§1),
               imagery is inline SVG with caption and source (§7), components
               reused rather than reinvented, no hardcoded hex colors (§3, §8).
            6. Accessibility and integrity — heading structure, meaning never
               carried by color alone, internal links resolve, HTML validates.

            Post a single concise review comment with findings ranked by
            severity, each naming the file and line and suggesting a concrete
            fix. If everything passes, say so briefly rather than inventing
            nits.

      - name: Record cost
        # always(): a step that failed still spent tokens — or spent none
        # because the API rejected it, which is the more useful signal. Still
        # gated on the key: without it there is no checkout, so the local
        # composite action would not exist to run.
        if: always() && env.HAS_ANTHROPIC_KEY == 'true'
        uses: ./.github/actions/record-cost
        with:
          execution-file: ${{ steps.agent.outputs.execution_file }}
          conclusion: ${{ steps.agent.outputs.conclusion }}
          workflow: Claude PR Review
          stage: review
          model-tier: sonnet

  # One ledger commit per run. Skipped for fork PRs: GITHUB_TOKEN is read-only
  # there, so the push could not succeed — and no agent ran anyway, because the
  # API key secret is not exposed to forks.
  ledger:
    needs: review
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/cost-ledger.yml
    permissions:
      contents: write
    with:
      workflow_label: Claude PR Review
