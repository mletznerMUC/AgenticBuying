# Automatic agentic code review on every pull request that touches the site
# or docs. Uses the site-reviewer conventions from .claude/agents/.
name: Claude PR Review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
    paths:
      - "*.html"
      - "assets/**"
      - "docs/**"

jobs:
  review:
    # Skip drafts and the agent's own trivial loops on forks without secrets
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      # secrets context is unavailable in job-level `if`, so gate steps via env
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Notice when ANTHROPIC_API_KEY is not configured
        if: env.HAS_ANTHROPIC_KEY != 'true'
        run: |
          echo "::notice::Skipping agentic PR review: ANTHROPIC_API_KEY secret is not set." \
            "Add it under Settings → Secrets and variables → Actions (see docs/WORKFLOW.md)."

      - name: Checkout repository
        if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude review
        if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request following the checklist in
            .claude/agents/site-reviewer.md: factual sourcing ("last verified"
            dates, source links), shipped/announced/speculative badges,
            neutrality of comparison content, identical shared navigation
            across all pages, internal link integrity, accessibility, and
            HTML validity. Post a single concise review comment with findings
            ranked by severity; if everything passes, say so briefly.
          claude_args: |
            --allowedTools "Bash(npx --yes html-validate:*)"
