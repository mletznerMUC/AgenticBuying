# Interactive agent workflow: mention @claude on an issue or PR and the agent
# implements the request on a branch and opens/updates a PR.
# Requires the ANTHROPIC_API_KEY repository secret (Settings → Secrets → Actions).
name: Claude Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # Implementation work runs longer than a review, but a hung agent job would
    # otherwise burn API tokens up to GitHub's 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Project conventions (CLAUDE.md) and subagents (.claude/agents/)
          # are picked up automatically from the checkout.
          claude_args: |
            --allowedTools "Bash(npx --yes html-validate:*)"
