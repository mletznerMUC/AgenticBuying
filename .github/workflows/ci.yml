# Quality gate for every PR and push to main: HTML validation + link checking.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-html:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate HTML
        run: npx --yes html-validate "*.html"

  # COST-CONTROL.md is generated. This catches a hand-edit, which would
  # otherwise be silently reverted by the next agent run with no trace of what
  # the author meant to say.
  check-cost-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Cost report matches the ledger
        run: python3 scripts/cost_report.py --check

  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          # Internal/offline only in CI to keep it deterministic; external
          # links are verified editorially with "last verified" dates.
          args: --offline --include-fragments --no-progress "*.html"
          fail: true
